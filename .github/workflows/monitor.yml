name: Monitor Dólar (Java)

on:
  schedule:
    # Lunes a viernes, 10:00 a 20:00 AR: cobertura continua.
    # Cubre el MULC (oficial, mayorista), el MEP/CCL, y la tarde del blue,
    # que se mueve después del cierre del mercado oficial.
    - cron: "0,30 13-23 * * 1-5"
    # Siempre, una ventana de ~50 min cada 3 horas: noches y fines de semana.
    # El cripto cotiza 24/7 y el blue también se mueve los sábados.
    # En días hábiles estos disparos quedan encolados detrás de la cobertura
    # continua y no molestan (el concurrency deja un solo pendiente).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-dolar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      # --- Aviso por movimiento de cualquier cotización (sube o baja) ---
      UMBRAL_PESOS: "1"
      UMBRAL_PORCENTAJE: "0"
      CAMPO: "venta"
      CASAS: ""

      # --- Tablero: tu posición en pesos vs dolarizarte ---
      TNA_PESOS: "17.5"
      FECHA_REFERENCIA: "03/09/2026"
      VALOR_REFERENCIA: "1530"
      CASA_REFERENCIA: "oficial"

      ITERACIONES: "11"
      INTERVALO_SEG: "300"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Compilar
        run: javac -d build DolarMonitor.java

      - name: Monitorear durante ~50 minutos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 "$ITERACIONES"); do
            echo "--- Chequeo $i/$ITERACIONES ---"

            java -cp build DolarMonitor || echo "El chequeo $i falló, sigo."

            git add -- ultimo_valor.json historial.json serie.json docs/index.html 2>/dev/null || true

            if ! git diff --staged --quiet; then
              git commit -q -m "Actualiza cotizaciones y tablero [skip ci]"
              # Si el rebase choca, abortarlo: con "|| true" solo, el repo queda
              # a mitad de rebase y el resto de la corrida no sube nada.
              if ! git pull --rebase --autostash -q; then
                git rebase --abort || true
                echo "Pull falló, reintento en el próximo ciclo."
              fi
              git push -q || echo "Push falló, reintento en el próximo ciclo."
            else
              echo "Sin novedades, no se commitea."
            fi

            if [ "$i" -lt "$ITERACIONES" ]; then
              sleep "$INTERVALO_SEG"
            fi
          done