name: Monitor Dólar (Java)

on:
  schedule:
    # Lunes a viernes, 10:00 a 20:00 AR: cobertura continua.
    # Cubre el MULC (oficial, mayorista), el MEP/CCL, y la tarde del blue,
    # que se mueve después del cierre del mercado oficial.
    # Minutos 7 y 37, no 0 y 30: en la hora en punto GitHub está saturado y
    # saltea más disparos. El cron es la red de seguridad; la cobertura
    # continua la da el último paso, que encadena la corrida siguiente.
    - cron: "7,37 13-23 * * 1-5"
    # Siempre, una ventana de ~50 min cada 3 horas: noches y fines de semana.
    # El cripto cotiza 24/7 y el blue también se mueve los sábados.
    # En días hábiles estos disparos quedan encolados detrás de la cobertura
    # continua y no molestan (el concurrency deja un solo pendiente).
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # para que cada corrida dispare la siguiente

concurrency:
  group: monitor-dolar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      # --- Aviso por movimiento de cualquier cotización (sube o baja) ---
      UMBRAL_PESOS: "1"
      UMBRAL_PORCENTAJE: "0"
      CAMPO: "venta"
      CASAS: ""

      # --- Tablero: tu posición en pesos vs dolarizarte ---
      TNA_PESOS: "17.5"
      FECHA_REFERENCIA: "03/09/2026"
      VALOR_REFERENCIA: "1530"
      CASA_REFERENCIA: "oficial"
      IPC_ESTIMADO: "2.0"

      ITERACIONES: "11"
      INTERVALO_SEG: "300"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Compilar
        run: javac -d build DolarMonitor.java

      - name: Monitorear durante ~50 minutos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 "$ITERACIONES"); do
            echo "--- Chequeo $i/$ITERACIONES ---"

            java -cp build DolarMonitor || echo "El chequeo $i falló, sigo."

            git add -- ultimo_valor.json historial.json serie.json inflacion.json docs/index.html 2>/dev/null || true

            if ! git diff --staged --quiet; then
              git commit -q -m "Actualiza cotizaciones y tablero [skip ci]"
              # Si el rebase choca, abortarlo: con "|| true" solo, el repo queda
              # a mitad de rebase y el resto de la corrida no sube nada.
              if ! git pull --rebase --autostash -q; then
                git rebase --abort || true
                echo "Pull falló, reintento en el próximo ciclo."
              fi
              git push -q || echo "Push falló, reintento en el próximo ciclo."
            else
              echo "Sin novedades, no se commitea."
            fi

            if [ "$i" -lt "$ITERACIONES" ]; then
              sleep "$INTERVALO_SEG"
            fi
          done

      # GitHub saltea crons durante horas (medido: 4 a 6 corridas por día de
      # unos 30 disparos). En horario hábil cada corrida dispara la siguiente
      # al terminar; workflow_dispatch es el único evento que el GITHUB_TOKEN
      # puede disparar. Si la cadena se corta, el cron la retoma.
      - name: Encadenar la próxima corrida
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dia=$(TZ=America/Argentina/Buenos_Aires date +%u)
          hora=$(TZ=America/Argentina/Buenos_Aires date +%H)
          if [ "$dia" -le 5 ] && [ "$hora" -ge 10 ] && [ "$hora" -lt 20 ]; then
            gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "No se pudo encadenar; queda el cron."
          else
            echo "Fuera de horario hábil: no se encadena, sigue el cron."
          fi
